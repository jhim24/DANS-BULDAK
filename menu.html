<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Menu | Dan's Cheesy Buldak</title>

<link rel="stylesheet"
href="assets/css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!--=========================
HEADER
==========================-->

<header>

<a href="index.html" class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

</a>

<h2>Our Menu</h2>

<div class="header-icons">

<button id="cartBtn">

<i class="fa-solid fa-cart-shopping"></i>

<span class="badge" id="cartBadge">0</span>

</button>

</div>

</header>

<!--=========================
SEARCH
==========================-->

<section class="search-section">

<div class="search-box">

<i class="fa-solid fa-magnifying-glass"></i>

<input
type="search"
id="searchInput"
placeholder="Search menu...">

</div>

</section>

<!--=========================
CATEGORY
==========================-->

<section class="categories">

<button class="active"
data-category="all">

All

</button>

<button
data-category="buldak">

Buldak

</button>

<button
data-category="ramen">

Ramen

</button>

<button
data-category="rice">

Rice

</button>

<button
data-category="drinks">

Drinks

</button>

<button
data-category="addons">

Add-ons

</button>

</section>

<!--=========================
PRODUCT LIST
==========================-->

<section class="menu-products">

<div
class="product-grid"
id="productGrid">

</div>

</section>

<script src="assets/js/menu.js"></script>

</body>

</html>
